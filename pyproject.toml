[project]
name = "mdl-hyperbolic"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jean-Gabriel Young", email = "jean.gabriel.young@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "ipykernel>=6.29.5",
    "jax[cuda]>=0.6.0",
    "matplotlib>=3.10.0",
    "networkx>=3.4.2",
    "numba>=0.65.0",
    "optax>=0.2.4",
    "pydantic>=2.11.3",
    "ruff>=0.11.0",
    "seaborn>=0.13.2",
    "tqdm>=4.67.1",
]

[project.scripts]
mdl-hyperbolic = "mdl_hyperbolic:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
